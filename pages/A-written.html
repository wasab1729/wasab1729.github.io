      <h2 class="problem-title">
        (<a href="https://onlinemathcontest.com/contests/omcb006/tasks/8280">
          OMCB006(C)
        </a>)
      </h2>

      <p>
        整数からなる集合の組 $(A,B)$ が次をみたすとき，<b>良い組</b>とよぶこととします：
      </p>
      <ul>
        <li>$|A|=|B|=4$ かつ $A\cup B=\{1,2,3,4,5,6,7,8\}$．</li>
        <li>$B$ に含まれる任意の要素は，$A$ に含まれる相異なる $2$ 整数の和として表せる．</li>
      </ul>
      <p>
        すべての良い組 $(A,B)$ に対して，「$A$ の要素の総和」の総和を解答してください．
      </p>
